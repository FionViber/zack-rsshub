name: Update RSSHub from upstream

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a full build/deploy even when the upstream SHA is unchanged'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: rsshub-upstream-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-deploy-verify:
    if: github.event_name == 'workflow_dispatch' || vars.RSSHUB_AUTO_UPDATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RSSHUB_CACHE_KV_ID: ${{ secrets.RSSHUB_CACHE_KV_ID }}
      RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}
      RSSHUB_TEST_BASE_URL: ${{ secrets.RSSHUB_TEST_BASE_URL }}
      FORCE_REBUILD: ${{ inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build, deploy, and verify the isolated RSSHub worker
        run: node scripts/build-and-deploy.mjs

      - name: Check service health once a week
        if: always() && !cancelled()
        run: node scripts/health-check.mjs

      - name: Record deployment and service health
        if: always() && !cancelled()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/
          git diff --cached --quiet || git commit -m "chore: record RSSHub deployment and health"
          git push
